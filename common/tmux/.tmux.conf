# ~/.tmux.conf

# ============================================================
# Shell
# ============================================================
# Use whatever shell the outer terminal is running (zsh, bash, etc.)
# instead of hardcoding a path — follows $SHELL automatically.
set -g default-shell "$SHELL"


# ============================================================
# Prefix key
# ============================================================
# Remap prefix from the default Ctrl-b to Ctrl-a (easier to reach).
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# ============================================================
# General behavior
# ============================================================
# Use vi-style keybindings when in copy mode (navigate with hjkl, etc.)
setw -g mode-keys vi

# Enable mouse support: click to switch panes, scroll, resize, etc.
set -g mouse on


# ============================================================
# Appearance
# ============================================================
# Highlight the currently active window in the status bar.
set -g window-status-current-style bg=yellow,fg=black

# Defaults are only 10 / 40 chars, which truncates the session name
# on the left and the clock or hostname on the right.
set -g status-left-length 40
set -g status-right-length 80


# ============================================================
# Clipboard integration
# ============================================================
# Let tmux pass through OSC 52 escape sequences so copy operations
# can reach the system clipboard (useful over SSH too).
set -s set-clipboard on

# Explicitly enable clipboard passthrough for xterm-like terminals,
# ensuring OSC 52 works correctly even if auto-detection misses it.
set -as terminal-features ',xterm*:clipboard'

# In copy mode (vi-style), pressing 'y' copies the selection directly
# into the system clipboard, then exits copy mode. The copy command
# differs per OS, so it lives in ~/.tmux.os.conf (macos or linux tmux package).
source-file ~/.tmux.os.conf


# ============================================================
# Custom keybindings / scripts
# ============================================================
# Prefix + f: open a new tmux window running the tmux-sessionizer script
# (quick fuzzy project/session switcher).
bind-key f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# Prefix + c / % / " : new window or split, opened in the current pane's
# directory, with the mlir venv activated when under ~/hexdev.
# tmux otherwise starts new windows and splits in the session's
# original directory rather than the one you are working in.
bind-key c run-shell "~/.local/bin/hexdev-new-window.sh window"
bind % run-shell "~/.local/bin/hexdev-new-window.sh hsplit"
bind '"' run-shell "~/.local/bin/hexdev-new-window.sh vsplit"
